name: Feature request
description: Propose a focused, reusable improvement to the standard or its tooling.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Explain the reusable problem before proposing an implementation. Project-specific business rules do not belong in the generic kernel.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What recurring problem should the standard solve, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior rather than only an implementation preference.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Specification or Schema
        - Bootstrap or distribution
        - Runtime Skill
        - Workspace template
        - Localization
        - GitHub or release engineering
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Identify stable IDs, versions, ownership, migrations, and POSIX/Windows impact.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security and authorization impact
      description: Explain network, installation, overwrite, external-action, and privacy implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: The proposal is reusable and does not embed private project rules.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
