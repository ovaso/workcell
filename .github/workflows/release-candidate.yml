name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from VERSION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  build:
    name: Build release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Confirm version
        shell: bash
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "$CANDIDATE_VERSION"
      - name: Run full validation
        shell: bash
        run: tests/run.sh
      - name: Build release candidate
        shell: bash
        run: scripts/package-bootstrap-skill.sh
      - name: Upload candidate without publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-standard-workspace-release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
