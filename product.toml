[product]
id = "workcell"
name = "Workcell"
version = "0.3.0"
status = "stable"
distribution = "bootstrap-skill"
text_only = true
ai_platform_neutral = true
license = "MIT"
bootstrap_host_profiles = ["posix-sh-v0.1", "powershell-v0.1"]
cross_host_platform_bootstrap = true

[source]
repository_role = "canonical-source"
default_branch = "main"
bootstrap_skill = "skills/bootstrap-workcell"
workspace_asset = "skills/bootstrap-workcell/assets/workspace-v0.1"
generated_directories = [
  "skills/bootstrap-workcell/references/specs",
  "skills/bootstrap-workcell/references/schemas",
  "skills/bootstrap-workcell/references/product-docs",
  "skills/bootstrap-workcell/references/product-facts",
  "skills/bootstrap-workcell/LICENSES",
  "skills/bootstrap-workcell/assets/workspace-v0.1/.ai-workspace/specs",
  "skills/bootstrap-workcell/assets/workspace-v0.1/.ai-workspace/schemas",
  "skills/bootstrap-workcell/assets/workspace-v0.1/docs/workcell"
]
generated_files = [
  "skills/bootstrap-workcell/LICENSE",
  "skills/bootstrap-workcell/assets/workspace-v0.1/LICENSE",
  "skills/bootstrap-workcell/assets/workspace-v0.1/knowledge/tool-capabilities.toml",
  "skills/bootstrap-workcell/assets/workspace-v0.1/.ai-workspace/release-manifest.json",
  "skills/bootstrap-workcell/checksums/workspace-v0.1.sha256"
]

[schemas]
workspace = "0.1"
release_manifest = "0.1"
environment_facts = "0.1"
project_plugin = "0.1"
diagnostic_capability = "0.1"
task = "0.1"
feedback_report = "0.1"

[apis]
project_plugin = "0.1"
diagnostic_plugin = "0.1"

[release]
canonical_repository = "https://github.com/ovaso/workcell"
self_update = false
immutable_release_required = true
