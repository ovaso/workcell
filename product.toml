[product]
id = "ai-native-standard-workspace"
name = "AI Native Standard Workspace"
version = "0.1.0"
status = "draft"
distribution = "bootstrap-skill"
text_only = true
ai_platform_neutral = true
bootstrap_host_profile = "posix-sh-v0.1"
cross_host_platform_bootstrap = false

[source]
repository_role = "canonical-source"
default_branch = "main"
bootstrap_skill = "skills/bootstrap-standard-workspace"
workspace_asset = "skills/bootstrap-standard-workspace/assets/workspace-v0.1"
generated_directories = [
  "skills/bootstrap-standard-workspace/references/specs",
  "skills/bootstrap-standard-workspace/references/schemas",
  "skills/bootstrap-standard-workspace/references/product-docs",
  "skills/bootstrap-standard-workspace/references/product-facts",
  "skills/bootstrap-standard-workspace/LICENSES",
  "skills/bootstrap-standard-workspace/assets/workspace-v0.1/.ai-workspace/specs",
  "skills/bootstrap-standard-workspace/assets/workspace-v0.1/.ai-workspace/schemas",
  "skills/bootstrap-standard-workspace/assets/workspace-v0.1/docs/standard"
]
generated_files = [
  "skills/bootstrap-standard-workspace/LICENSE",
  "skills/bootstrap-standard-workspace/assets/workspace-v0.1/knowledge/tool-capabilities.toml",
  "skills/bootstrap-standard-workspace/assets/workspace-v0.1/.ai-workspace/release-manifest.json",
  "skills/bootstrap-standard-workspace/checksums/workspace-v0.1.sha256"
]

[schemas]
workspace = "0.1"
release_manifest = "0.1"
environment_facts = "0.1"
project_plugin = "0.1"
diagnostic_capability = "0.1"
task = "0.1"
feedback_report = "0.1"

[apis]
project_plugin = "0.1"
diagnostic_plugin = "0.1"

[release]
canonical_repository = "unassigned"
self_update = false
immutable_release_required = true
