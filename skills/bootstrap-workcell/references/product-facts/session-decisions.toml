[meta]
date = "2026-07-31"
source = "current-session"
status = "confirmed-design-decisions"

[[decisions]]
id = "platform-neutral-bootstrap"
statement = "The product is a platform-neutral, text-only, self-contained Bootstrap Skill rather than a Codex Plugin."

[[decisions]]
id = "workspace-self-hosting"
statement = "Bootstrap only expands, validates, repairs, and upgrades; the expanded workspace self-hosts with its own runtime Skills."

[[decisions]]
id = "facts-before-project-action"
statement = "Workspace initialization establishes host environment facts before attaching a project and generating its project plugin."

[[decisions]]
id = "project-plugin-boundary"
statement = "The generic workflow contains no project facts; each project declares its identity, modules, rules, knowledge, and specialized capabilities through a project plugin."

[[decisions]]
id = "diagnostics-as-capability"
statement = "Diagnostics are a project capability plugin configured through an interactive questionnaire, fact discovery, and code inspection."

[[decisions]]
id = "diagnostics-target-neutral"
statement = "Diagnostic targets include local CLIs, desktop clients, codebases, bare-metal systems, containers, clusters, and observability systems."

[[decisions]]
id = "agents-generated-adapter"
statement = "Structured policies and facts are sources of truth; AI files such as AGENTS are compiled adapters, and hard diagnostic constraints must reach the effective AI instructions immediately."

[[decisions]]
id = "capability-not-authorization"
statement = "The presence of a tool does not authorize the corresponding action; environment capability, Provider support, project policy, and task authorization must all permit it."

[[decisions]]
id = "distribution-model"
statement = "One Git repository maintains source; stable tags produce the Skill ZIP, manifests, and checksums used for distribution and installation."

[[decisions]]
id = "self-update-deferred"
statement = "Self-update is implemented only after the production standard, canonical repository, and formal Release process are stable; automatic checks may be enabled by default, but automatic application is not."

[[decisions]]
id = "canonical-english-localization"
statement = "English is canonical; explicit localization generates reviewed non-authoritative content without changing stable identifiers, schemas, policies, or the English control plane."
